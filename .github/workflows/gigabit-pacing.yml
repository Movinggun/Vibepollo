name: Gigabit pacing checks

on:
  push:
    branches: [master, 'codex/gigabit-stream-pacing']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pacing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Fetch the pinned test dependency
        run: git submodule update --init --depth=1 third-party/googletest
      - name: Build and run PyroWave policy tests
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -pthread \
            -I. -Ithird-party/googletest/googletest/include \
            -Ithird-party/googletest/googletest \
            src/pyrowave_policy.cpp tests/unit/test_pyrowave_policy.cpp \
            third-party/googletest/googletest/src/gtest-all.cc \
            third-party/googletest/googletest/src/gtest_main.cc \
            -o pyrowave-policy-tests
          ./pyrowave-policy-tests
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: '24'
      - name: Install both UI dependency sets
        run: |
          npm ci --prefix src_assets/common/assets/web-legacy --no-audit --no-fund
          npm ci --prefix src_assets/common/assets/web --no-audit --no-fund
      - name: Verify the web UI
        run: |
          npm run test:unit --prefix src_assets/common/assets/web
          npm run build --prefix src_assets/common/assets/web
          npm run build --prefix src_assets/common/assets/web-legacy
